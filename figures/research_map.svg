<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1180" viewBox="0 0 1360 1180">
<rect x="0" y="0" width="1360" height="1180" rx="0" fill="#F6F8FC" stroke="none"/>
<text x="56" y="60" font-family="Inter,Arial,sans-serif" font-size="31" fill="#101828" font-weight="700" text-anchor="start">What research can grow from an economic episode table?</text>
<text x="56" y="92" font-family="Inter,Arial,sans-serif" font-size="16" fill="#667085" font-weight="400" text-anchor="start">Each card states a question and the extra evidence required before making the claim.</text>
<rect x="56" y="120" width="1248" height="90" rx="20" fill="#172B4D" stroke="none"/>
<text x="680" y="158" font-family="Inter,Arial,sans-serif" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle">Source-linked assertion → challenge → settlement episodes</text>
<text x="680" y="186" font-family="Inter,Arial,sans-serif" font-size="15" fill="#DDE7F5" font-weight="400" text-anchor="middle">bonds · rewards · disputes · outcomes · delay · evidence status</text>
<text x="56" y="256" font-family="Inter,Arial,sans-serif" font-size="20" fill="#176B87" font-weight="800" text-anchor="start">ECONOMICS</text>
<text x="716" y="256" font-family="Inter,Arial,sans-serif" font-size="20" fill="#6941C6" font-weight="800" text-anchor="start">TRUSTWORTHY AI</text>
<rect x="56" y="280" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="56" y="280" width="10" height="164" rx="10" fill="#176B87" stroke="none"/>
<rect x="84" y="300" width="48" height="28" rx="14" fill="#EAF5F7" stroke="none"/>
<text x="108" y="320" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176B87" font-weight="800" text-anchor="middle">E1</text>
<text x="144" y="321" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Costly information production</text>
<text x="84" y="356" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">When do rewards and capital at risk attract costly monitoring?</text>
<text x="84" y="407" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Gas cost; evidence-acquisition cost; complete sampling window</text>
<rect x="56" y="470" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="56" y="470" width="10" height="164" rx="10" fill="#176B87" stroke="none"/>
<rect x="84" y="490" width="48" height="28" rx="14" fill="#EAF5F7" stroke="none"/>
<text x="108" y="510" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176B87" font-weight="800" text-anchor="middle">E2</text>
<text x="144" y="511" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Mechanism design</text>
<text x="84" y="546" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">Which bond reward and deadline rules minimize false acceptance and</text>
<text x="84" y="568" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">wasteful disputes?</text>
<text x="84" y="597" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Independent truth; rule changes; realized transfers; social-loss</text>
<text x="84" y="617" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">weights</text>
<rect x="56" y="660" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="56" y="660" width="10" height="164" rx="10" fill="#176B87" stroke="none"/>
<rect x="84" y="680" width="48" height="28" rx="14" fill="#EAF5F7" stroke="none"/>
<text x="108" y="700" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176B87" font-weight="800" text-anchor="middle">E3</text>
<text x="144" y="701" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Public goods and market structure</text>
<text x="84" y="736" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">Is decentralized verification supplied by a concentrated group of</text>
<text x="84" y="758" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">specialists?</text>
<text x="84" y="787" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Addresses; actor history; transfers; entity-linkage policy</text>
<rect x="56" y="850" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="56" y="850" width="10" height="164" rx="10" fill="#176B87" stroke="none"/>
<rect x="84" y="870" width="48" height="28" rx="14" fill="#EAF5F7" stroke="none"/>
<text x="108" y="890" font-family="Inter,Arial,sans-serif" font-size="13" fill="#176B87" font-weight="800" text-anchor="middle">E4</text>
<text x="144" y="891" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Delay and opportunity cost</text>
<text x="84" y="926" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">How much economic friction is created by dispute resolution and</text>
<text x="84" y="948" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">locked capital?</text>
<text x="84" y="977" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Token prices; capital amounts; discount rate; censoring</text>
<rect x="716" y="280" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="716" y="280" width="10" height="164" rx="10" fill="#6941C6" stroke="none"/>
<rect x="744" y="300" width="48" height="28" rx="14" fill="#F1EDFF" stroke="none"/>
<text x="768" y="320" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6941C6" font-weight="800" text-anchor="middle">T1</text>
<text x="804" y="321" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Economically rational decisions</text>
<text x="744" y="356" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">Can an agent choose Accept Investigate Challenge or Abstain under</text>
<text x="744" y="378" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">real costs?</text>
<text x="744" y="407" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Decision-time evidence; action costs; independent truth</text>
<rect x="716" y="470" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="716" y="470" width="10" height="164" rx="10" fill="#6941C6" stroke="none"/>
<rect x="744" y="490" width="48" height="28" rx="14" fill="#F1EDFF" stroke="none"/>
<text x="768" y="510" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6941C6" font-weight="800" text-anchor="middle">T2</text>
<text x="804" y="511" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Calibration and abstention</text>
<text x="744" y="546" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">Does the agent abstain when evidence is weak and stakes are high?</text>
<text x="744" y="597" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Probabilities; truth labels; stake and harm categories</text>
<rect x="716" y="660" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="716" y="660" width="10" height="164" rx="10" fill="#6941C6" stroke="none"/>
<rect x="744" y="680" width="48" height="28" rx="14" fill="#F1EDFF" stroke="none"/>
<text x="768" y="700" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6941C6" font-weight="800" text-anchor="middle">T3</text>
<text x="804" y="701" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Evidence fidelity and no leakage</text>
<text x="744" y="736" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">Do cited sources support the action using only information available</text>
<text x="744" y="758" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">at decision time?</text>
<text x="744" y="787" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Timestamped evidence snapshots; model tool traces</text>
<rect x="716" y="850" width="588" height="164" rx="18" fill="#FFFFFF" stroke="#D8E2F0"/>
<rect x="716" y="850" width="10" height="164" rx="10" fill="#6941C6" stroke="none"/>
<rect x="744" y="870" width="48" height="28" rx="14" fill="#F1EDFF" stroke="none"/>
<text x="768" y="890" font-family="Inter,Arial,sans-serif" font-size="13" fill="#6941C6" font-weight="800" text-anchor="middle">T4</text>
<text x="804" y="891" font-family="Inter,Arial,sans-serif" font-size="18" fill="#172B4D" font-weight="700" text-anchor="start">Robustness and human oversight</text>
<text x="744" y="926" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">Does the agent remain stable under conflicting evidence and escalate</text>
<text x="744" y="948" font-family="Inter,Arial,sans-serif" font-size="14" fill="#344054" font-weight="500" text-anchor="start">high-risk cases?</text>
<text x="744" y="977" font-family="Inter,Arial,sans-serif" font-size="12" fill="#B54708" font-weight="600" text-anchor="start">ADD: Adversarial variants; repeated runs; escalation labels</text>
<text x="56" y="1035" font-family="Inter,Arial,sans-serif" font-size="18" fill="#344054" font-weight="800" text-anchor="start">STUDENT ROADMAP</text>
<rect x="56" y="1080" width="285" height="54" rx="14" fill="#DCEBFF" stroke="none"/>
<rect x="377" y="1080" width="285" height="54" rx="14" fill="#DDF6EC" stroke="none"/>
<rect x="698" y="1080" width="285" height="54" rx="14" fill="#FFF0D9" stroke="none"/>
<rect x="1019" y="1080" width="285" height="54" rx="14" fill="#F0E8FF" stroke="none"/>
<text x="198" y="1114" font-family="Inter,Arial,sans-serif" font-size="14" fill="#175CD3" font-weight="700" text-anchor="middle">MVP · inspect every row</text>
<text x="519" y="1114" font-family="Inter,Arial,sans-serif" font-size="14" fill="#067647" font-weight="700" text-anchor="middle">Real window · verify sources</text>
<text x="840" y="1114" font-family="Inter,Arial,sans-serif" font-size="14" fill="#B54708" font-weight="700" text-anchor="middle">Economics · identify effects</text>
<text x="1162" y="1114" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6941C6" font-weight="700" text-anchor="middle">AI · benchmark decisions</text>
